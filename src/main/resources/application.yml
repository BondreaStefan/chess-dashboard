spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  application:
    name: chess-dashboard

  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/chess_dashboard
    username: chess
    password: chess_local_dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          '[time_zone]': UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

logging:
  level:
    '[org.flywaydb]': INFO

jwt:
  secret: ${JWT_SECRET:TnwtIwzvFPd8fOObu0oNC0BeEpi9hf5qRBE4cPpTUnc=}
  expiration-ms: 3600000